info:
  name: Update Banner
  type: http
  seq: 26

http:
  method: POST
  url: "{{baseUrl}}/core-api/recipe/{{recipeId}}/banner"
  body:
    type: json
    # Upload the photo to Firebase Storage first, under recipe_banners/<your uid>/; core-api
    # builds the banner's URL from its path and refuses any other folder.
    data: |-
      {
        "path": "recipe_banners/YOUR_UID/recipe-1730000000000.jpg"
      }
  auth:
    type: bearer
    token: "{{idToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
