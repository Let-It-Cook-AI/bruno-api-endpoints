info:
  name: Stream Dish Request
  type: http
  seq: 23

http:
  method: POST
  url: "{{baseUrl}}/core-api/recipe/dish-request/generate/stream"
  body:
    type: json
    data: |-
      {
        "dishRequest": "Pasta Carbonara",
        "effortLevel": "MEDIUM",
        "requestId": "{{$randomUUID}}"
      }
  auth:
    type: bearer
    token: "{{idToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
