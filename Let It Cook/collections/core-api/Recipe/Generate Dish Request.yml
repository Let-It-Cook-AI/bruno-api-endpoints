info:
  name: Generate Dish Request
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/core-api/recipe/dish-request/generate"
  body:
    type: json
    data: |-
      {
        "dishRequest": "Pasta Carbonara",
        "totalTimeMins": 20,
        "servings": 2,
        "vibe": ["Italian"],
        "ingredients": [],
        "extraNotes": "Traditional style",
        "macrosGoal": {
          "calories": 700,
          "proteinGrams": 25,
          "carbsGrams": 60,
          "fatGrams": 30
        },
        "effortLevel": "MEDIUM"
      }
  auth:
    type: bearer
    token: "{{idToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
