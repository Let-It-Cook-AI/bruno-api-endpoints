info:
  name: Get Created Recipes
  type: http
  seq: 13

http:
  method: GET
  # A page of summaries, newest first. For the next page add &cursor= with the reply's nextCursor.
  url: "{{baseUrl}}/core-api/recipe/created?limit=25"
  body:
    type: none
  auth:
    type: bearer
    token: "{{idToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
