info:
  name: Stream Recipe
  type: http
  seq: 22

http:
  method: POST
  url: "{{baseUrl}}/core-api/recipe/generate/stream"
  body:
    type: json
    data: |-
      {
        "usePantry": true,
        "effortLevel": "MEDIUM",
        "servings": 2,
        "requestId": "{{$randomUUID}}"
      }
  auth:
    type: bearer
    token: "{{idToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
