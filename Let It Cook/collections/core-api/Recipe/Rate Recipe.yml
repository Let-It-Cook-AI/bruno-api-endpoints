info:
  name: Rate Recipe
  type: http
  seq: 20

http:
  method: POST
  url: "{{baseUrl}}/core-api/recipe/{{recipeId}}/rate"
  body:
    type: json
    data: |-
      {
        "rating": 5
      }
  auth:
    type: bearer
    token: "{{idToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
