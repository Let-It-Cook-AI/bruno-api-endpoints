info:
  name: Finish Ingredients
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/core-api/pantry/finish"
  body:
    type: json
    data: |-
      {
        "names": ["Eggs", "Milk"]
      }
  auth:
    type: bearer
    token: "{{idToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
