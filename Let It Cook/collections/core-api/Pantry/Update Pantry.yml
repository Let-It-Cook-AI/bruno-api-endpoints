info:
  name: Update Pantry
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/core-api/pantry"
  body:
    type: json
    data: |-
      {
        "ingredients": [
          {
            "name": "Eggs",
            "quantity": 12.0,
            "unit": "PIECES"
          },
          {
            "name": "Milk",
            "quantity": 1.0,
            "unit": "LITERS"
          }
        ]
      }
  auth:
    type: bearer
    token: "{{idToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
