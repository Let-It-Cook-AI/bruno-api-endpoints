info:
  name: Parse Photo
  type: http
  seq: 6

http:
  method: POST
  # kind is RECEIPT or SHELF. The body is the photo itself (JPEG, PNG or HEIC, at most 2 MB);
  # core-api reads its type from its bytes, so anything else is refused with 415.
  url: "{{baseUrl}}/core-api/pantry/parse-photo?kind=RECEIPT"
  headers:
    - name: Content-Type
      value: image/jpeg
  body:
    type: file
    # Pick a photo of a receipt or a shelf on your machine.
    data:
      - filePath: receipt.jpg
        contentType: image/jpeg
        selected: true
  auth:
    type: bearer
    token: "{{idToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
