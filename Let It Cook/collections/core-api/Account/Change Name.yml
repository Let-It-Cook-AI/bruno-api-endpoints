info:
  name: Change Name
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/core-api/account/name"
  body:
    type: json
    data: |-
      {
        "newName": "John Doe"
      }
  auth:
    type: bearer
    token: "{{idToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
