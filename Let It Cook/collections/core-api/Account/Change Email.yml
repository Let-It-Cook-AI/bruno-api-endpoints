info:
  name: Change Email
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/core-api/account/email"
  body:
    type: json
    data: |-
      {
        "newEmail": "newuser@example.com"
      }
  auth:
    type: bearer
    token: "{{idToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
