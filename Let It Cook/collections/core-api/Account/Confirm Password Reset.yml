info:
  name: Confirm Password Reset
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/core-api/account/password/confirm"
  body:
    type: json
    data: |-
      {
        "email": "user@example.com",
        "code": "123456",
        "newPassword": "NewPassword123"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
